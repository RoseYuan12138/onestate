seed: 42
device: auto
output_dir: outputs/dyn_gen

data:
  num_samples: 1024
  history_frames: 3
  future_frames: 2
  num_slots: 4
  slot_dim: 16
  masked_slots: 1

model:
  model_dim: 128
  depth: 3
  heads: 4
  ffn_dim: 256
  qa_hidden_dim: 128
  image_size: 32
  dropout: 0.0

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 25

loss_weights:
  slot: 1.0
  masked_history: 0.25
  qa: 0.0
  rgb: 1.0
  mask: 0.25

