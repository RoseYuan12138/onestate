seed: 42
device: auto
output_dir: outputs/smoke

data:
  num_samples: 96
  history_frames: 3
  future_frames: 2
  num_slots: 4
  slot_dim: 16
  masked_slots: 1

model:
  model_dim: 48
  depth: 1
  heads: 4
  ffn_dim: 96
  qa_hidden_dim: 48
  image_size: 16
  dropout: 0.0

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 10

loss_weights:
  slot: 1.0
  masked_history: 0.25
  qa: 1.0
  rgb: 1.0
  mask: 0.25

